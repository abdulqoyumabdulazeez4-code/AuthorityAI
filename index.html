<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuthorityAI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loginPage">

        <h1>🔒 AuthorityAI</h1>

        <p>Enter Access Password</p>

        <input
            type="password"
            id="passwordBox"
            placeholder="Enter Password">

        <br><br>

        <button onclick="login()">
            Login
        </button>

        <p id="loginResult"></p>

    </div>

    <div id="mainApp" style="display:none;">

        <h1>👑 AuthorityAI</h1>

        <p>Create AI videos from your images</p>

        <input
            type="text"
            id="prompt"
            placeholder="Describe your video">

        <br><br>

        <input
            type="file"
            id="imageUpload">

        <br><br>

        <button onclick="generateVideo()">
            Generate Video
        </button>

        <br><br>

        <p id="result"></p>

    </div>

    <script src="app.js"></script>

</body>
</html>
