<!<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AuthorityAI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="loginPage">

        <h1>🔒 AuthorityAI</h1>

        <p>Enter Access Password</p>

        <input
            type="password"
            id="passwordBox"
            placeholder="Enter Password">

        <br><br>

        <button onclick="login()">
            Login
        </button>

        <p id="loginResult"></p>

    </div>


    <div id="mainApp" style="display:none;">

        <div class="hero">

            <h1>👑 AUTHORITY AI</h1>

            <p class="tagline">
                Create Powerful AI Videos From Images
            </p>

        </div>


        <div class="generator-card">

            <h2>🎬 Video Generator</h2>

            <input
                type="text"
                id="prompt"
                placeholder="Describe your video">

            <br><br>


            <input
                type="file"
                id="imageUpload"
                accept="image/*">

            <br><br>


            <label for="videoLength">
                Video Length
            </label>

            <br><br>

            <select id="videoLength">

                <option value="5">
                    5 seconds
                </option>

                <option value="10">
                    10 seconds
                </option>

                <option value="15">
                    15 seconds
                </option>

            </select>

            <br><br>


            <button onclick="generateVideo()">
                Generate Video
            </button>

            <br><br>

            <p id="result"></p>

        </div>


        <div class="footer">
            Powered by AuthorityAI 👑
        </div>

    </div>


    <script src="app.js"></script>

</body>
</html>
